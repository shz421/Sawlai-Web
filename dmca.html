<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DMCA and copyright policy for Sawlai Library.">
    <title>Copyright & DMCA - Sawlai Library</title>
    <link rel="icon" type="image/png" href="assets/images/app-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="assets/styles/icofont.min.css">
    <link rel="stylesheet" href="assets/styles/bootstrap.min.css">
    <link rel="stylesheet" href="assets/styles/aos.css">
    <link rel="stylesheet" href="assets/styles/style.css">
    <link rel="stylesheet" href="assets/styles/responsive.css">
    <link rel="stylesheet" href="assets/styles/site.css?v=7">
    <style>
        .legal-wrap {
            max-width: 1080px;
            margin: 0 auto;
        }

        .legal-hero {
            min-height: auto;
            padding-bottom: 12px;
        }

        .legal-hero::after {
            display: none;
        }

        .legal-hero .hero-bg {
            background:
                radial-gradient(circle at 18% 25%, rgba(41, 182, 246, 0.2), transparent 36%),
                radial-gradient(circle at 82% 18%, rgba(87, 199, 255, 0.18), transparent 34%),
                linear-gradient(180deg, rgba(15, 23, 42, 0.72), rgba(7, 8, 22, 0.98));
        }

        .legal-hero h1 {
            color: #fff;
            font-weight: 800;
            font-size: clamp(1.9rem, 4vw, 3rem);
            line-height: 1.2;
            margin: 12px 0 0;
        }

        .legal-hero .hero-sub {
            max-width: 560px;
            margin: 14px auto 0;
        }

        .legal-body-section {
            padding-top: 44px;
        }

        .legal-langs {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .legal-lang {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            padding: 26px 24px 28px;
            color: #e2e8f0;
            line-height: 1.85;
            text-align: left;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.25);
        }

        .legal-lang p {
            margin: 0 0 14px;
        }

        .legal-lang p:last-child {
            margin-bottom: 0;
        }

        .legal-lang strong {
            color: #fff;
        }

        .legal-lang a:not(.community-link):not(.legal-chip) {
            color: var(--saw-accent-2);
            font-weight: 600;
        }

        .legal-lang-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 26px 0 16px;
            padding-bottom: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.12rem;
            font-weight: 700;
            line-height: 1.45;
        }

        .legal-lang-title:first-child {
            margin-top: 0;
        }

        .legal-lang-title::before {
            content: "";
            flex: 0 0 auto;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(140deg, var(--saw-accent-2), var(--saw-accent));
            box-shadow: 0 0 12px rgba(41, 182, 246, 0.55);
        }

        .legal-checklist {
            list-style: none;
            padding: 0;
            margin: 4px 0 18px;
            display: grid;
            gap: 9px;
        }

        .legal-checklist li {
            position: relative;
            padding: 11px 15px 11px 42px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .legal-checklist li::before {
            content: "";
            position: absolute;
            left: 17px;
            top: 16px;
            width: 10px;
            height: 5px;
            border-left: 2px solid var(--saw-accent-2);
            border-bottom: 2px solid var(--saw-accent-2);
            transform: rotate(-45deg);
        }

        .legal-cta-row {
            margin: 4px 0 0;
            text-align: center;
        }

        .legal-cta {
            overflow-wrap: anywhere;
        }

        .legal-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 18px;
            margin: 4px 6px 4px 0;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.24s ease, background 0.24s ease, border-color 0.24s ease;
        }

        .legal-chip:hover {
            transform: translateY(-2px);
            background: rgba(41, 182, 246, 0.16);
            border-color: rgba(87, 199, 255, 0.45);
        }

        .loading-spinner {
            text-align: center;
            padding: 30px 0 10px;
        }

        .loading-spinner .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--saw-accent-2);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        .loading-spinner p {
            color: var(--saw-muted);
            margin: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-msg {
            color: #ff8b8b;
            text-align: center;
            padding: 26px 20px;
            border-radius: 20px;
            border: 1px dashed rgba(255, 107, 107, 0.4);
            background: rgba(255, 107, 107, 0.06);
        }

        .error-msg p {
            margin: 0 0 6px;
        }

        .error-msg p:last-child {
            margin-bottom: 0;
        }

        @media (max-width: 991px) {
            .legal-langs {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 767px) {
            .legal-lang {
                padding: 22px 18px 24px;
                border-radius: 20px;
            }

            .legal-lang-title {
                font-size: 1.05rem;
            }

            .legal-checklist li {
                padding: 10px 13px 10px 38px;
            }

            .legal-checklist li::before {
                left: 15px;
            }

            .legal-cta {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="page_wrapper sawlai_site">
        <div id="preloader" aria-hidden="true">
            <div class="brand-loader">
                <img src="assets/images/app-logo.png" alt="Sawlai Library">
                <p>Preparing Sawlai Library</p>
                <div id="loader"></div>
            </div>
        </div>

        <header class="saw-header">
            <div class="container">
                <nav class="navbar navbar-expand-lg saw-nav" aria-label="Main Navigation">
                    <a class="navbar-brand saw-brand" href="/">
                        <img src="assets/images/app-logo.png" alt="Sawlai Library Logo">
                        <span>Sawlai Library</span>
                    </a>

                    <button class="navbar-toggler saw-toggler" type="button" data-toggle="collapse"
                        data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <span></span><span></span><span></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ml-auto saw-links">
                            <li class="nav-item"><a class="nav-link" href="/#home">Home</a></li>
                            <li class="nav-item"><a class="nav-link" href="readers">Readers</a></li>
                            <li class="nav-item"><a class="nav-link" href="/#download">Download</a></li>
                            <li class="nav-item"><a class="nav-link" href="about-us">About Us</a></li>
                        </ul>
                    </div>
                </nav>
            </div>
        </header>

        <main>
            <section class="hero-section legal-hero section-pad" aria-labelledby="dmca-title">
                <div class="hero-bg" aria-hidden="true"></div>
                <div class="particle-layer" aria-hidden="true"></div>
                <div class="container legal-wrap">
                    <div class="section-head" data-aos="fade-up">
                        <p class="eyebrow">Policy</p>
                        <h1 id="dmca-title">Copyright & DMCA</h1>
                        <p class="hero-sub">How to report content, and what happens next.</p>
                    </div>
                </div>
            </section>

            <section class="legal-body-section section-pad" aria-label="Copyright policy">
                <div class="container legal-wrap">
                    <div id="dmca-content" data-aos="fade-up" data-aos-delay="80">
                        <div class="loading-spinner">
                            <div class="spinner"></div>
                            <p>Loading content...</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="saw-footer">
            <div class="container">
                <div class="footer-top">
                    <a class="footer-brand" href="/">
                        <img src="assets/images/app-logo.png" alt="Sawlai Library logo">
                        <span>Sawlai Library</span>
                    </a>
                    <ul class="social-links" aria-label="Social links">
                        <li><a href="/">Home</a></li>
                        <li><a href="about-us">About</a></li>
                        <li><a href="privacy-policy">Privacy</a></li>
                    </ul>
                </div>
                <p class="copyright">Copyright 2024 - 2026 Sawlai Library. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script src="assets/scripts/jquery.js"></script>
    <script src="assets/scripts/bootstrap.min.js"></script>
    <script src="assets/scripts/aos.js"></script>
    <script src="assets/scripts/site.js?v=6"></script>
    <script>
        (function () {
            var API_URL = 'https://lib.sawlai.com/json/Others/DMCA.json';
            var SLOT = '';
            var container = document.getElementById('dmca-content');
            var MAILTO_LIMIT = 1900;

            var escapeHtml = function (value) {
                return String(value == null ? '' : value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            };

            var safeHttpUrl = function (raw) {
                var url = String(raw == null ? '' : raw).trim();
                return /^https?:\/\/[^\s]+$/i.test(url) ? url : null;
            };

            var mailtoAddress = function (email) {
                var clean = String(email == null ? '' : email).trim();
                return /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(clean)
                    ? clean
                    : encodeURIComponent(clean);
            };

            var mailtoHref = function (email, subject, body) {
                var href = 'mailto:' + mailtoAddress(email);
                var params = [];
                var line = subject ? subject.trim() : '';
                if (line) params.push('subject=' + encodeURIComponent(line));
                var text = body ? body.trim() : '';
                if (text) {
                    var encoded = encodeURIComponent(text);
                    var prefix = href + (params.length ? '?' + params.join('&') + '&' : '?') + 'body=';
                    if (prefix.length + encoded.length <= MAILTO_LIMIT) {
                        params.push('body=' + encoded);
                    }
                }
                return params.length ? href + '?' + params.join('&') : href;
            };

            var activityHref = function (activity) {
                var key = String(activity || '').trim().toLowerCase();
                if (key === 'faqactivity' || key === 'help') return '/#faq';
                if (key === 'home') return '/';
                if (key === 'dmca' || key === 'copyright') return 'dmca';
                if (key === 'about') return 'about-us';
                if (key === 'reports') return mailtoHref('sawlai.library@gmail.com', 'Report - Sawlai Library', '');
                return '/';
            };

            var renderSection = function (raw) {
                var slots = [];
                var source = String(raw == null ? '' : raw);

                var keep = function (html, block) {
                    slots.push({ html: html, block: !!block });
                    return SLOT + (slots.length - 1) + SLOT;
                };

                var out = source;

                out = out.replace(/<\/?[mshb]>/gi, '');
                out = out.replace(/^[ \t]*<br>[ \t]*$/gim, '');

                out = out.replace(/\[([^\]]+)\]\(email=([\s\S]*?)\)(?=\s*(?:\n|$))/g,
                    function (match, display, params) {
                        var rest = params;
                        var subject = '';
                        var body = '';
                        var at = rest.indexOf('&body=');
                        if (at !== -1) {
                            body = rest.slice(at + 6);
                            rest = rest.slice(0, at);
                        }
                        at = rest.indexOf('&subject=');
                        if (at !== -1) {
                            subject = rest.slice(at + 9);
                            rest = rest.slice(0, at);
                        }
                        return keep('<a class="community-link legal-cta" href="' +
                            escapeHtml(mailtoHref(rest, subject, body)) + '">' +
                            escapeHtml(display.trim()) + '</a>', true);
                    });

                out = out.replace(/\[([^\]]+)\]\(link=([\s\S]*?)\)(?=\s*(?:\n|$))/g,
                    function (match, display, url) {
                        var safe = safeHttpUrl(url);
                        if (!safe) return escapeHtml(display.trim());
                        return keep('<a href="' + escapeHtml(safe) + '" target="_blank" rel="noopener">' +
                            escapeHtml(display.trim()) + '</a>');
                    });

                out = out.replace(/\[([^\]]+)\]\(activity=([^)]+)\)/g,
                    function (match, display, activity) {
                        return keep('<a class="legal-chip" href="' + escapeHtml(activityHref(activity)) +
                            '">' + escapeHtml(display.trim()) + '</a>');
                    });

                out = out.replace(/\[([^\]]+)\]\(fetch=([^)]+)\)/g,
                    function (match, display) {
                        return keep('<a class="legal-chip" href="/">' + escapeHtml(display.trim()) + '</a>');
                    });

                out = out.replace(/\[([^\]]*@[^\]]+\.[A-Za-z]{2,})\]/g,
                    function (match, email) {
                        var clean = email.trim();
                        return keep('<a href="mailto:' + escapeHtml(mailtoAddress(clean)) + '">' +
                            escapeHtml(clean) + '</a>');
                    });

                out = out.replace(/\[image\]\(([^)|]+)(?:\|(\d+))?(?:\|(\d+))?\)/g,
                    function (match, url, w, h) {
                        var safe = safeHttpUrl(url);
                        if (!safe) return '';
                        var width = w ? Math.min(parseInt(w, 10), 300) : 300;
                        var height = h ? Math.min(parseInt(h, 10), 300) : 300;
                        return keep('<img src="' + escapeHtml(safe) + '" alt="" loading="lazy" decoding="async" ' +
                            'style="max-width:' + width + 'px;max-height:' + height +
                            'px;border-radius:12px;vertical-align:middle;">');
                    });

                out = out.replace(/<br\s*\/?>/gi, function () {
                    return keep('<br>');
                });

                out = escapeHtml(out);

                out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                out = out.replace(/_\*([^*]+)\*_/g, '<em>$1</em>');
                out = out.replace(/(https?:\/\/[^\s<>&"]+)/g,
                    '<a href="$1" target="_blank" rel="noopener">$1</a>');

                var restore = function (text) {
                    return text.replace(/(\d+)/g, function (match, index) {
                        return slots[Number(index)].html;
                    });
                };

                var lines = out.split('\n');
                var html = '';
                var inList = false;

                var closeList = function () {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                };

                for (var i = 0; i < lines.length; i++) {
                    var trimmed = lines[i].trim();

                    if (trimmed === '') {
                        closeList();
                        continue;
                    }

                    var solo = trimmed.match(/^(\d+)$/);
                    if (solo) {
                        closeList();
                        var slot = slots[Number(solo[1])];
                        html += slot.block
                            ? '<p class="legal-cta-row">' + slot.html + '</p>'
                            : slot.html;
                        continue;
                    }

                    var heading = trimmed.match(/^<strong>([^<]+)<\/strong>$/);
                    if (heading) {
                        closeList();
                        html += '<h2 class="legal-lang-title">' + restore(heading[1]) + '</h2>';
                        continue;
                    }

                    if (trimmed.indexOf('- ') === 0) {
                        if (!inList) {
                            html += '<ul class="legal-checklist">';
                            inList = true;
                        }
                        html += '<li>' + restore(trimmed.slice(2)) + '</li>';
                        continue;
                    }

                    closeList();
                    html += '<p>' + restore(trimmed) + '</p>';
                }

                closeList();
                return html;
            };

            var render = function (body) {
                var sections = String(body == null ? '' : body)
                    .replace(/\r\n?/g, '\n')
                    .split(/\n[ \t]*-{3,}[ \t]*\n/)
                    .map(function (part) { return part.trim(); })
                    .filter(function (part) { return part.length > 0; });

                if (!sections.length) {
                    return '<p>No content available.</p>';
                }

                if (sections.length === 1) {
                    return '<article class="legal-lang">' + renderSection(sections[0]) + '</article>';
                }

                return '<div class="legal-langs">' + sections.map(function (part) {
                    return '<article class="legal-lang">' + renderSection(part) + '</article>';
                }).join('') + '</div>';
            };

            fetch(API_URL)
                .then(function (response) {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(function (data) {
                    if (!data || !data.length) throw new Error('Empty data');
                    var item = data[0];
                    if (item.Title) {
                        document.getElementById('dmca-title').textContent = item.Title;
                    }
                    container.innerHTML = render(item.Body || '');

                    if (typeof AOS !== 'undefined') {
                        AOS.refresh();
                    }
                })
                .catch(function (err) {
                    container.innerHTML = '<div class="error-msg">' +
                        '<p>Failed to load the copyright policy.</p>' +
                        '<p style="font-size:0.85rem;opacity:0.75;">' + escapeHtml(err.message) + '</p>' +
                        '</div>';
                });
        })();
    </script>
</body>

</html>
