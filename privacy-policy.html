    <link rel="icon" type="image/png" href="assets/images/app-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/styles/icofont.min.css">
    <link rel="stylesheet" href="assets/styles/bootstrap.min.css">
    <link rel="stylesheet" href="assets/styles/aos.css">
    <link rel="stylesheet" href="assets/styles/style.css">
    <link rel="stylesheet" href="assets/styles/responsive.css">
    <link rel="stylesheet" href="assets/styles/site.css">
    <style>
        .legal-wrap { max-width: 920px; margin: 0 auto; }
        .legal-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            padding: 28px 22px;
            color: #e2e8f0;
            line-height: 1.8;
            text-align: left;
        }
        .legal-card h2 { color: #fff; font-size: 1.2rem; margin-top: 22px; }
        .legal-card strong { color: #fff; }
        .legal-card ul { padding-left: 20px; margin: 8px 0; }
        .legal-card li { margin-bottom: 4px; }
        .legal-card a { color: #57c7ff; font-weight: 600; }
        .loading-spinner { text-align: center; padding: 40px 0; }
        .loading-spinner .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #57c7ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg { color: #ff6b6b; text-align: center; padding: 20px; }
    </style>
</head>

<body>
    <div class="page_wrapper sawlai_site">
        <div id="preloader" aria-hidden="true">
            <div class="brand-loader">
                <img src="assets/images/app-logo.png" alt="Sawlai Library">
                <p>Preparing Sawlai Library</p>
                <div id="loader"></div>
            </div>
        </div>

        <header class="saw-header">
            <div class="container">
                <nav class="navbar navbar-expand-lg saw-nav" aria-label="Main Navigation">
                    <a class="navbar-brand saw-brand" href="/">
                        <img src="assets/images/app-logo.png" alt="Sawlai Library Logo">
                        <span>Sawlai Library</span>
                    </a>

                    <button class="navbar-toggler saw-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span></span><span></span><span></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ml-auto saw-links">
                            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                            <li class="nav-item"><a class="nav-link" href="/#download">Download</a></li>
                            <li class="nav-item"><a class="nav-link" href="about-us.html">About Us</a></li>
                        </ul>
                    </div>
                </nav>
            </div>
        </header>

        <main>
            <section class="hero-section section-pad" aria-labelledby="privacy-title">
                <div class="hero-bg" aria-hidden="true"></div>
                <div class="particle-layer" aria-hidden="true"></div>
                <div class="container legal-wrap">
                    <div class="section-head" data-aos="fade-up">
                        <p class="eyebrow">Policy</p>
                        <h1 id="privacy-title">Privacy Policy</h1>
                        <p class="hero-sub mx-auto" id="privacy-sub">Loading...</p>
                    </div>

                    <article class="legal-card" id="privacy-content" data-aos="fade-up" data-aos-delay="80">
                        <div class="loading-spinner">
                            <div class="spinner"></div>
                            <p>Loading content...</p>
                        </div>
                    </article>
                </div>
            </section>
        </main>

        <footer class="saw-footer">
            <div class="container">
                <div class="footer-top">
                    <a class="footer-brand" href="/">
                        <img src="assets/images/app-logo.png" alt="Sawlai Library logo">
                        <span>Sawlai Library</span>
                    </a>
                    <ul class="social-links" aria-label="Social links">
                        <li><a href="/">Home</a></li>
                        <li><a href="about-us.html">About</a></li>
                        <li><a href="dmca.html">DMCA</a></li>
                    </ul>
                </div>
                <p class="copyright">Copyright 2024 - 2026 Sawlai Library. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script src="assets/scripts/jquery.js"></script>
    <script src="assets/scripts/bootstrap.min.js"></script>
    <script src="assets/scripts/aos.js"></script>
    <script src="assets/scripts/site.js"></script>
    <script>
    (function() {
        const API_URL = 'https://lib.sawlai.com/json/Others/Privacy-Policy.json';
        const container = document.getElementById('privacy-content');

        function renderMarkdown(text) {
            if (!text) return '<p>No content available.</p>';

            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            html = html.replace(/<m>\s*/g, '');
            html = html.replace(/\s*<m>/g, '');
            html = html.replace(/<s>\s*/g, '');
            html = html.replace(/\s*<s>/g, '');
            html = html.replace(/<\/?h>/g, '');
            html = html.replace(/<\/?b>/g, '');

            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

            html = html.replace(/_\*([^*]+)\*_/g, '<em>$1</em>');

            html = html.replace(
                /\[([^\]]*@[^\]]+\.\w+)\]/g,
                function(m, email) { return '<a href="mailto:' + encodeURIComponent(email.trim()) + '">' + email.trim() + '</a>'; }
            );

            html = html.replace(
                /\[([^\]]+)\]\(email=([^&)]+)(?:&subject=([^&)]*))?(?:&body=([^)]*))?\)/g,
                function(match, display, email, subject, body) {
                    let href = 'mailto:' + encodeURIComponent(email.trim());
                    if (subject) href += '?subject=' + encodeURIComponent(subject.trim());
                    if (body) href += (subject ? '&' : '?') + 'body=' + encodeURIComponent(body.trim());
                    return '<a href="' + href + '">' + display.trim() + '</a>';
                }
            );

            html = html.replace(
                /\[([^\]]+)\]\(link=([^)]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener">$1</a>'
            );

            html = html.replace(
                /\[([^\]]+)\]\(activity=([^)]+)\)/g,
                function(match, display, activity) {
                    var a = activity.trim().toLowerCase();
                    if (a === 'dmca' || a === 'copyright') return '<a href="dmca.html">' + display.trim() + '</a>';
                    if (a === 'about') return '<a href="about-us.html">' + display.trim() + '</a>';
                    if (a === 'home') return '<a href="/">' + display.trim() + '</a>';
                    return '<a href="/">' + display.trim() + '</a>';
                }
            );

            html = html.replace(
                /\[([^\]]+)\]\(fetch=([^)]+)\)/g,
                '<a href="/">$1</a>'
            );

            html = html.replace(
                /\[image\]\(([^)|]+)(?:\|(\d+))?(?:\|(\d+))?\)/g,
                function(match, url, w, h) {
                    var width = w ? Math.min(parseInt(w), 300) : 300;
                    var height = h ? Math.min(parseInt(h), 300) : 300;
                    return '<img src="' + url.trim() + '" alt="image" style="max-width:' + width + 'px;max-height:' + height + 'px;border-radius:8px;vertical-align:middle;" loading="lazy">';
                }
            );

            html = html.replace(
                /(https?:\/\/[^\s<]+)/g,
                '<a href="$1" target="_blank" rel="noopener">$1</a>'
            );

            var lines = html.split('\n');
            var result = '';
            var inList = false;
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                var trimmed = line.trim();
                if (trimmed.startsWith('- ')) {
                    if (!inList) { result += '<ul>'; inList = true; }
                    result += '<li>' + trimmed.substring(2) + '</li>';
                } else {
                    if (inList) { result += '</ul>'; inList = false; }
                    if (trimmed === '') continue;
                    result += '<p>' + line + '</p>';
                }
            }
            if (inList) result += '</ul>';
            result = result.replace(/<p>\s*<br>\s*<\/p>/g, '');
            result = result.replace(/(<br>\s*){2,}/g, '<br>');
            return result || '<p>No content available.</p>';
        }

        function renderContent(data) {
            if (!data || !data.length) return;
            var item = data[0];
            var title = item.Title || 'Privacy Policy';
            var body = item.Body || '';
            document.getElementById('privacy-title').textContent = title;
            container.innerHTML = renderMarkdown(body);
            if (typeof AOS !== 'undefined') AOS.refresh();
        }

        // Inline fallback content (same as server JSON, used when KV fetch fails)
        var _fallbackBody = "Last Updated: [15 May 2025]\n\n"
            + "Developer: Sawlai (shz)\nApp Name: **Sawlai Library : Books & Audio**\nContact Email: [sawlai.library@gmail.com]\n\n"
            + "This Privacy Policy explains how Sawlai (shz) collects, uses, and protects your information when you use Sawlai Library the app. By using this app, you agree to the terms outlined in this policy.\n\n"
            + "1. <m> **Information Collection and Use**<m>\nFor a better user experience, Sawlai Library may collect certain personally identifiable information, including but not limited to:\n\n"
            + "- Google Advertising ID (for analytics and ad personalization)\n- Device Information (model, OS version)\n- Log Data (app crashes, usage statistics via third-party services like Google Play Services)\n\n"
            + "We do not store personal data on our servers. All collected data remains on your device unless shared with third-party services (see Section 3).\n\n"
            + "2. <m>**Third-Party Services**<m>\nThe app uses third-party services that may collect data:\n\n"
            + "- Google Play Services (Privacy Policy)\n- Firebase Analytics (Privacy Policy)\n\n"
            + "These services help improve app functionality, analyze usage, and display ads (if applicable).\n\n"
            + "3. <m>**Cookies & Tracking Technologies**<m>\nSawlai Library does not explicitly use cookies. However, third-party libraries (e.g., Google Ads) may use cookies for analytics. You can opt out of cookie tracking in your device settings.\n\n"
            + "4. <m> **Data Security**<m>\nWe prioritize your data security but cannot guarantee 100% protection due to internet risks. We recommend:\n\n- Using secure networks when accessing the app.\n- Avoiding sharing sensitive personal information.\n\n"
            + "5. <m> **Links to External Sites**<m>\nThe app may contain links to third-party websites. We are not responsible for their privacy practices. Review their policies before sharing data.\n\n"
            + "6. - <m> **Children's Privacy**<m>\nSawlai Library does not knowingly collect data from children under 13. If we discover such data, we will delete it immediately. Parents/guardians may contact us at [sawlai.library@gmail.com] for concerns.\n\n"
            + "7. - <m> **Changes to This Policy**<m>\nWe may update this policy periodically. Check this page for changes. Continued app use means you accept the updated policy.\n\n"
            + "8. - <m> **Copyright & User-Uploaded Content**<m>\nUsers may upload books, but we do not claim ownership of copyrighted material. If you believe your rights were violated, contact the original author/publisher or email us for removal.\n\n"
            + "9. <m>**- Contact Us**<m>\nFor privacy-related questions, contact: [sawlai.library@gmail.com]";

        fetch(API_URL)
            .then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function(data) { renderContent(data); })
            .catch(function() {
                renderContent([{ Title: 'Privacy Policy', Body: _fallbackBody }]);
            });
    })();
    </script>
</body>

</html>
