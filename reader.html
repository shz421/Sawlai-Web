<body>
    <div class="page_wrapper sawlai_site">
        <header class="saw-header" id="home">
            <div class="container">
                <nav class="navbar navbar-expand-lg saw-nav" aria-label="Main Navigation">
                    <a class="navbar-brand saw-brand" href="/">
                        <img src="assets/images/app-logo.png" alt="Sawlai Library Logo">
                        <span>Sawlai Library</span>
                    </a>

                    <button class="navbar-toggler saw-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span></span><span></span><span></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ml-auto saw-links">
                            <li class="nav-item"><a class="nav-link" href="index.html#home">Home</a></li>
                            <li class="nav-item"><a class="nav-link" href="readers.html">Readers</a></li>
                            <li class="nav-item"><a class="nav-link" href="index.html#download">Download</a></li>
                            <li class="nav-item"><a class="nav-link" href="about-us.html">About Us</a></li>
                        </ul>
                    </div>
                </nav>
            </div>
        </header>

        <main>
            <section class="reader-shell section-pad" aria-labelledby="reader-profile-title">
                <div class="container">
                    <div id="reader-profile-loading" class="reader-empty" data-aos="fade-up">Loading reader profile...</div>
                    <div id="reader-profile-error" class="reader-empty" hidden></div>

                    <div id="reader-profile" hidden>
                        <div class="reader-profile-head" data-aos="fade-up">
                            <div class="reader-profile-avatar-wrap">
                                <img id="reader-profile-avatar" class="reader-profile-avatar" src="assets/images/app-logo.png" alt="Reader profile">
                            </div>
                            <div class="reader-profile-copy">
                                <p class="eyebrow">Reader Profile</p>
                                <h1 id="reader-profile-title">Reader</h1>
                                <p id="reader-profile-sub" class="reader-sub"></p>
                                <a id="reader-profile-share" class="community-link" href="#" hidden>Share Profile</a>
                            </div>
                        </div>

                        <div class="reader-toolbar" data-aos="fade-up" data-aos-delay="60">
                            <div class="reader-stat">
                                <span>Completed books</span>
                                <strong id="reader-books-total">-</strong>
                            </div>
                        </div>

                        <div id="reader-books" class="completed-book-grid" data-aos="fade-up" data-aos-delay="80"></div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="saw-footer">
            <div class="container">
                <div class="footer-top">
                    <a class="footer-brand" href="/">
                        <img src="assets/images/app-logo.png" alt="Sawlai Library logo">
                        <span>Sawlai Library</span>
                    </a>
                    <ul class="social-links" aria-label="Social links">
                        <li><a class="social-pill social-pill-telegram" href="https://t.me/shz421" target="_blank" rel="noopener" aria-label="Open Sawlai Library Telegram channel"><span>TG</span>Telegram</a></li>
                        <li><a class="social-pill social-pill-facebook" href="https://www.facebook.com/profile.php?id=61590780832470" target="_blank" rel="noopener" aria-label="Open Sawlai Library Facebook page"><span>f</span>Facebook</a></li>
                        <li><a href="privacy-policy.html">Privacy</a></li>
                        <li><a href="dmca.html">DMCA</a></li>
                    </ul>
                </div>
                <p class="copyright">Copyright 2024 - 2026 Sawlai Library. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script>

    <script src="assets/scripts/aos.js"></script>
